name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main # Cambia esto si tu rama principal tiene otro nombre (ej. master)
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Este token ya viene por defecto en GitHub
          action: "upload"
          app_location: "/" # Ruta de tu código HTML/CSS/JS (ej. "/" o "/src")
          api_location: ""
          output_location: "" # Carpeta de build (ej. "dist" o "build". Si es HTML puro, déjalo vacío "")
